<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления — Практическая №3</title>

  <!-- Подключение Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Собственные стили -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

  <!-- Навигационная панель (Navbar) -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">АдминПанель</a>
        
        <!-- Кнопка-гамбургер для мобильных устройств -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#dashboard">Обзор</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#activity">Активность</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#reports">Отчеты</a>
            </li>
          </ul>
          
          <!-- Дополнительные действия в шапке -->
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#infoOffcanvas">
              Справка
            </button>
            <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#addRecordModal">
              + Добавить
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Основной контент панели -->
  <main class="container py-4">
    
    <!-- Заголовок страницы -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-0">Панель показателей</h1>
        <p class="text-muted small mb-0">Мониторинг ключевых метрик и активности</p>
      </div>
    </div>

    <!-- Секция карточек (заполним на 2 этапе) -->
    <section id="dashboard" class="mb-4">
      <div class="row g-3" id="statsCardsContainer">
        <!-- Карточки показателей будут здесь -->
      </div>
    </section>

    <!-- Секция таблицы активности (заполним на 2 этапе) -->
    <section id="activity" class="mb-4">
      <!-- Таблица будет здесь -->
    </section>

  </main>

  <!-- Подключение Bootstrap 5 JS Bundle (включает Popper.js) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Собственный скрипт -->
  <script src="js/app.js"></script>
</body>
</html>
